name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      # CodeQL now analyzes js/ts AND the workflow files (the actions language)—markdown still needs no security scan, so skip ALL docs (a doc-only commit doesn't run CodeQL). Shipped SKILL.md/commands consistency is ci.yml's job (verify dist-sync), not CodeQL's.
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      # CodeQL now analyzes js/ts AND the workflow files (the actions language)—markdown still needs no security scan, so skip ALL docs (a doc-only commit doesn't run CodeQL). Shipped SKILL.md/commands consistency is ci.yml's job (verify dist-sync), not CodeQL's.
      - '**.md'
      - 'LICENSE'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# cancel-in-progress: TRUE (CWK-058, canon: .github/SKILL-REPO-PATTERN.md) -- NOT the
# same discriminator as scorecard.yml's FALSE below, though both upload a SARIF. This
# workflow publishes ONLY to GitHub code scanning, one atomic upload-or-nothing: a
# killed run simply never uploads, and the PRIOR analysis stands intact, not corrupted.
# scorecard.yml additionally posts to a third-party API it does not control, where a
# cancelled publish can be left partially applied -- that is the reason it cancels FALSE
# while this workflow, uploading the same artifact TYPE, safely cancels TRUE.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (javascript)
    runs-on: ubuntu-latest
    permissions:
      # CWK-120 row 5 (CodeRabbit). A job-level `permissions:` block REPLACES the
      # workflow-level one -- it does not merge (this room measured that exact fact
      # in its own board #117 work on claude-ai-zips.yml) -- so the top-level
      # `contents: read` above does NOT reach this job, and every scope this block
      # omits is `none`. `actions/checkout` below therefore ran with no contents
      # read granted. It resolves TODAY because the repo is PUBLIC (measured, not
      # reasoned: this workflow's runs on main are green, CWK-112's widening
      # included); the grant is added so the job does not silently break the day
      # the repo, the token defaults, or the checkout action change.
      # The bot's claim said "both job-level permission blocks" and this file has
      # exactly ONE job (`analyze`) with exactly ONE such block -- counted, not
      # assumed. `actions: read` is NOT added: codeql-action recommends it for
      # PRIVATE repos only, and minimum-power (Q#4) says an unneeded scope stays
      # ungranted.
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript, actions
          queries: security-and-quality
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
